# HyperFleet E2E Test Configuration
#
# This is the main configuration file for the E2E test framework.
# It is automatically loaded from ./configs/config.yaml if present.
#
# Configuration Priority (highest to lowest):
#   1. Command-line flags
#   2. Environment variables (HYPERFLEET_* prefix; AUTH_MODE and TENANT_MODEL are unprefixed)
#   3. This config file
#   4. Built-in defaults
#
# See docs/config.md for full documentation

# Authentication placement. AUTH_MODE and HYPERFLEET_AUTH_MODE override this value.
# Values: NONE, API, EDGE, EDGE+API.
auth_mode: EDGE+API

# Tenant model of the deployment. It selects the tenant claims of human tokens.
# It must match the TENANT_MODEL that you used to deploy HyperFleet.
# TENANT_MODEL and HYPERFLEET_TENANT_MODEL override this value.
# Values: onprem, oracle.
tenant_model: onprem

# ============================================================================
# API Configuration
# ============================================================================

api:
  # HyperFleet API URL
  # Can be overridden by:
  #   - CLI flag: --api-url
  #   - Environment variable: HYPERFLEET_API_URL
  #
  # This is REQUIRED for running tests
  url: ""

# ============================================================================
# Timeout Configuration
# ============================================================================

timeouts:
  # Per-kind timeouts default in the descriptor table (EntityDescriptors in
  # pkg/config/descriptor.go). Override them under timeouts.<kind>, where <kind>
  # is any descriptor kind in lower case (cluster, nodepool, parent,
  # cascadechild, ...). A field left out or set to zero keeps the row default;
  # an unknown <kind> or field, or a value without a unit ("300" or 300), fails
  # the run.
  #
  # Format: Duration string with a unit (e.g., "30m", "1h", "5m")
  # Can be overridden by:
  #   - HYPERFLEET_TIMEOUTS_<KIND>_RECONCILED (time to reach the Reconciled condition)
  #   - HYPERFLEET_TIMEOUTS_<KIND>_DELETED (time to hard-delete, a 404 response)
  #
  # Example override (not the defaults):
  # cluster:
  #   reconciled: 10m

  adapter:
    # Maximum time to wait for adapter processing
    #
    # Format: Duration string
    # Can be overridden by: HYPERFLEET_TIMEOUTS_ADAPTER_PROCESSING
    processing: 2m

# ============================================================================
# Polling Configuration
# ============================================================================

polling:
  # Polling interval for status checks
  # How often to check cluster/adapter status during wait operations
  #
  # Lower values = faster feedback, higher API load
  # Higher values = slower feedback, lower API load
  #
  # Format: Duration string
  # Recommended: 10s for production, 5s for development (faster feedback)
  # Can be overridden by: HYPERFLEET_POLLING_INTERVAL
  interval: 10s

# ============================================================================
# Logging Configuration
# ============================================================================

log:
  # Log level: debug, info, warn, error
  # Can be overridden by: HYPERFLEET_LOG_LEVEL
  level: info

  # Log format: text, json
  # Can be overridden by: HYPERFLEET_LOG_FORMAT
  format: text

  # Log output: stdout, stderr
  # Can be overridden by: HYPERFLEET_LOG_OUTPUT
  output: stdout

# ============================================================================
# Adapter Configuration
# ============================================================================

# Each descriptor kind's required adapters default in the descriptor table
# (EntityDescriptors in pkg/config/descriptor.go) to the names hyperfleet-infra
# deploys. The specs check that each one is present and has the expected
# conditions. Override a kind's list under adapters.<kind>, where <kind> is any
# descriptor kind in lower case; a key that is present replaces the whole list
# and must name at least one adapter (blank names are dropped), and an unknown
# <kind> fails the run. A kind with adapters also needs a reconciled timeout.
#
# Can be overridden by (comma-separated):
#   - HYPERFLEET_ADAPTERS_<KIND>
#   - API_ADAPTERS_CLUSTER / API_ADAPTERS_NODEPOOL (aliases for cluster and
#     nodepool, removed with the per-kind suites in HYPERFLEET-1734)
#
# Example override (not the defaults; the list replaces the row's list):
# adapters:
#   nodepool:
#     - "np-custom"

# ============================================================================
# Delivery Path Configuration
# ============================================================================

desire:
  # The cluster adapter that delivers on a remote transport (desire store ->
  # applier). It must also be one of the Cluster required adapters: the
  # remote-transport suite fails when it is not, so the tier suites always check
  # the remote path.
  # Can be overridden by: HYPERFLEET_DESIRE_ADAPTER
  adapter: "cl-desire"

# ============================================================================
# Identity Configuration
# ============================================================================

identity:
  # Normal API operations run as a human. In every authenticated mode, the
  # suite mints a JWT for hyperfleet-e2e@example.com from the mock OIDC issuer
  # in NAMESPACE. The JWT has the tenant claims of tenant_model.

  # Expected audit identity for test assertions on created_by / deleted_by.
  # If empty, the framework derives it from AUTH_MODE:
  #   API and EDGE+API: the email of the default human.
  #   EDGE: system@hyperfleet.local. The API does not validate tokens in this
  #   mode and records its system default.
  # Can be overridden by: HYPERFLEET_IDENTITY_EXPECTEDIDENTITY
  expectedIdentity: ""

  # Token Request Configuration (K8s TokenRequest API)
  # The machine-auth specs in e2e/auth use it to mint ServiceAccount tokens.
  # Normal API operations do not use it.
  #
  # Authenticated modes default to ServiceAccount hyperfleet-e2e-runner.
  # Namespace defaults to the E2E namespace (NAMESPACE).
  # The e2e Helmfile environment creates the runner ServiceAccount.
  # The runner credentials need permission to create TokenRequests for it.
  #
  # Can be overridden by environment variables:
  #   HYPERFLEET_IDENTITY_TOKENREQUEST_NAMESPACE
  #   HYPERFLEET_IDENTITY_TOKENREQUEST_AUDIENCE
  #   HYPERFLEET_IDENTITY_TOKENREQUEST_EXPIRATIONSECONDS
  tokenRequest:
    serviceAccountName: ""
    namespace: ""
    audience: "hyperfleet-api"
    expirationSeconds: 7200
